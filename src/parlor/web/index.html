<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parlor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@2.1.3/lib/three-vrm-animation.module.js"
  }
}
</script>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark"></div>
    <h1>Parlor</h1>
  </div>
  <span class="model-label">{{model}}</span>
  <div id="status" class="status-pill disconnected">Disconnected</div>
</header>

<div class="portal-stack">
  <!-- 3D Avatar & Webcam viewport with glow layers -->
  <div id="viewportWrap" class="viewport-wrap mode-avatar loading">
    <div class="viewport-glow"></div>

    <!-- Amica 3D VRM Canvas -->
    <canvas id="vrmCanvas"></canvas>

    <!-- Picture-in-Picture / Camera Viewport -->
    <div id="pipWrap" class="pip-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div class="pip-overlay">
        <span class="pip-badge">Vision Cam</span>
        <button id="pipExpandBtn" class="pip-btn" title="Expand Camera View">⛶</button>
      </div>
    </div>
  </div>

  <!-- Audio waveform visualizer -->
  <div class="waveform-wrap">
    <canvas id="waveform"></canvas>
  </div>

  <!-- Transcript -->
  <div id="messages" class="transcript"></div>

  <!-- Controls -->
  <div class="controls">
    <button id="viewToggle" class="ctrl-btn active">Avatar View</button>
    <label class="ctrl-btn file-btn" title="Load custom .vrm model">
      <span>Load VRM</span>
      <input type="file" id="vrmFileInput" accept=".vrm" style="display:none;">
    </label>
    <button id="cameraToggle" class="ctrl-btn active">Camera On</button>
    <div id="modeChip" class="mode-chip" hidden>
      <span id="modeLabel">Translating → English</span>
      <button id="modeStop" class="mode-stop">stop</button>
    </div>
    <div class="state-indicator">
      <div id="stateDot" class="dot loading"></div>
      <span id="stateText">Loading...</span>
    </div>
    <span class="on-device-pill">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="12" height="9" rx="2"/><path d="M5 4V3a3 3 0 0 1 6 0v1"/></svg>
      On-device
    </span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
