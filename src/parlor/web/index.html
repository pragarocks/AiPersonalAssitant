<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parlor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@2.1.3/lib/three-vrm-animation.module.js"
  }
}
</script>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark"></div>
    <h1>Parlor</h1>
  </div>
  
  <!-- Mode Switcher Tabs -->
  <div class="mode-tabs">
    <button id="btnVisualMode" class="tab-btn active">Visual Mode</button>
    <button id="btnAvatarMode" class="tab-btn">VRMA Avatar Mode</button>
  </div>

  <span class="model-label">{{model}}</span>
  <div id="status" class="status-pill disconnected">Disconnected</div>
</header>

<div class="portal-stack">
  <!-- Viewport container with glow layers -->
  <div id="viewportWrap" class="viewport-wrap view-visual loading">
    <div class="viewport-glow"></div>

    <!-- 1. Video Container (Full size in Visual Mode, compact PiP in Avatar Mode) -->
    <div id="videoWrap" class="video-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div id="pipLabel" class="pip-label" style="display:none;">Vision Cam</div>
    </div>

    <!-- 2. Maya/Amica 3D VRM Stage (Full size in Avatar Mode, hidden in Visual Mode) -->
    <div id="avatarStage" class="avatar-stage"></div>
  </div>

  <!-- Maya Avatar Quick Actions Bar (Shown only in Avatar Mode) -->
  <div id="mayaActions" class="maya-actions">
    <button class="action-btn" data-gesture="wave">👋 Wave</button>
    <button class="action-btn" data-gesture="nod">🙂 Nod</button>
    <button class="action-btn" data-gesture="thinking">🤔 Think</button>
    <button class="action-btn" data-gesture="clap">👏 Clap</button>
    <button class="action-btn" data-gesture="lookAround">👀 Look Around</button>
    <label class="action-btn file-btn" title="Load custom .vrm file">
      📁 Load .vrm
      <input type="file" id="vrmInput" accept=".vrm" style="display:none;">
    </label>
  </div>

  <!-- Audio waveform visualizer -->
  <div class="waveform-wrap">
    <canvas id="waveform"></canvas>
  </div>

  <!-- Transcript -->
  <div id="messages" class="transcript"></div>

  <!-- Controls -->
  <div class="controls">
    <button id="cameraToggle" class="ctrl-btn active">Camera On</button>
    <div id="modeChip" class="mode-chip" hidden>
      <span id="modeLabel">Translating → English</span>
      <button id="modeStop" class="mode-stop">stop</button>
    </div>
    <div class="state-indicator">
      <div id="stateDot" class="dot loading"></div>
      <span id="stateText">Loading...</span>
    </div>
    <span class="on-device-pill">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="12" height="9" rx="2"/><path d="M5 4V3a3 3 0 0 1 6 0v1"/></svg>
      On-device
    </span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
